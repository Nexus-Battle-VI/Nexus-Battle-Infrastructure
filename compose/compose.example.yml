# Composición de referencia del sistema completo.
#
# Reproduce en una máquina de desarrollo la misma topología que la arquitectura
# de demo: un proxy inverso al frente, seis servicios detrás y las bases de
# datos como contenedores con volúmenes propios.
#
# ATENCIÓN — este fichero NO es apto para producción:
#   - las credenciales son de ejemplo y están en claro;
#   - no hay TLS, réplica ni copias de seguridad;
#   - los servicios no verifican quién realiza la petición (ver ADR-004).
#
# Se copia a `compose.yml` y se ajusta antes de usarlo.

name: nexus-battles-vi

services:
  # ---------------------------------------------------------------------
  # Entrada
  # ---------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    mem_limit: 64m
    pids_limit: 64
    ports:
      - '8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - account
      - inventory
      - catalog
      - community
      - commerce
    restart: unless-stopped

  web:
    image: ghcr.io/nexus-battle-vi/nexus-battle-web:latest
    mem_limit: 48m
    pids_limit: 64
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Servicios
  # ---------------------------------------------------------------------
  account:
    image: ghcr.io/nexus-battle-vi/nexus-battle-account:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      # El adaptador PostgreSQL depende de ADR-005. Con `memory`, el servicio
      # arranca sin base de datos; con `postgres`, valida la configuración y
      # advierte de que el adaptador todavía no existe.
      PERSISTENCE_DRIVER: memory
      DATABASE_URL: postgres://account:cambiar@postgres:5432/account
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  inventory:
    image: ghcr.io/nexus-battle-vi/nexus-battle-player-inventory:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: memory
      MONGODB_URI: mongodb://inventory:cambiar@mongo:27017/player-inventory?authSource=player-inventory
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    image: ghcr.io/nexus-battle-vi/nexus-battle-catalog:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3003
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: memory
      MONGODB_URI: mongodb://catalog:cambiar@mongo:27017/catalog?authSource=catalog
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  community:
    image: ghcr.io/nexus-battle-vi/nexus-battle-community:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3004
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: memory
      DATABASE_URL: postgres://community:cambiar@postgres:5432/community
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  commerce:
    image: ghcr.io/nexus-battle-vi/nexus-battle-commerce:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3005
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: memory
      DATABASE_URL: postgres://commerce:cambiar@postgres:5432/commerce
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notifications:
    image: ghcr.io/nexus-battle-vi/nexus-battle-notifications:latest
    mem_limit: 128m
    pids_limit: 128
    environment:
      NODE_ENV: production
      HEALTH_PORT: 3001
      LOG_LEVEL: info
      # Mailpit permite ver los correos sin enviarlos a nadie.
      EMAIL_DRIVER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: no-reply@nexus-battles.local
      # El adaptador SQS depende de ADR-006.
      QUEUE_DRIVER: memory
    depends_on:
      - mailpit
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Persistencia
  #
  # Cada servicio conserva base lógica y credenciales propias aunque el motor
  # sea compartido. Compartir host es una concesión de coste; compartir
  # esquema sería renunciar a la arquitectura.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    mem_limit: 288m
    pids_limit: 256
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: cambiar
      POSTGRES_DB: nexus
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:8
    mem_limit: 384m
    pids_limit: 256
    # Definir el usuario raiz es lo que ACTIVA la autenticacion en la imagen
    # oficial. Sin estas variables Mongo arranca abierto y cualquier servicio
    # puede leer la base de otro, aunque cada uno use la suya.
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: cambiar
    volumes:
      - mongo-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--username',
          'root',
          '--password',
          'cambiar',
          '--authenticationDatabase',
          'admin',
          '--eval',
          'db.adminCommand("ping")',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Correo de desarrollo
  # ---------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    mem_limit: 64m
    pids_limit: 64
    ports:
      - '8025:8025' # interfaz web para inspeccionar los correos
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
