# Composición de referencia del sistema completo.
#
# Reproduce en una máquina de desarrollo la misma topología que la arquitectura
# de demo: un proxy inverso al frente, seis servicios detrás y las bases de
# datos como contenedores con volúmenes propios.
#
# ATENCIÓN — este fichero NO es apto para producción:
#   - las credenciales son de ejemplo y están en claro;
#   - no hay TLS, réplica ni copias de seguridad;
#   - los servicios no verifican quién realiza la petición (ver ADR-004).
#
# Por eso `NODE_ENV` es `development` y no `production`, y no es un descuido:
# un binario con `NODE_ENV=production` y `AUTH_MODE=disabled` **NO ARRANCA**.
# Es deliberado —la traducción en código del BLOCKER de ADR-004— y significa que
# este stack, tal cual, no se puede desplegar de cara a internet aunque alguien
# lo intente.
#
# El pool de Cognito YA está aprovisionado, así que activar la verificación de
# identidad ya no exige editar cinco bloques de este fichero: se copia
# `.env.example` a `.env` junto a este compose y se pone `AUTH_MODE=jwt`. Con
# eso, `NODE_ENV: production` vuelve a ser correcto.
#
# Lo que NO se puede cambiar desde aquí es la identidad de `web`. Sus variables
# `VITE_` se resuelven al COMPILAR la imagen, no al arrancar el contenedor:
# ponerlas en `environment` no haría nada, y aparentar que sí lo hace sería peor
# que no ponerlas. Para cambiarlas hay que reconstruir la imagen.
#
# Se copia a `compose.yml` y se ajusta antes de usarlo.

name: nexus-battles-vi

services:
  # ---------------------------------------------------------------------
  # Entrada
  # ---------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    mem_limit: 64m
    pids_limit: 64
    ports:
      - '8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - account
      - inventory
      - catalog
      - community
      - commerce
    restart: unless-stopped

  web:
    image: ghcr.io/nexus-battle-vi/nexus-battle-web:latest
    mem_limit: 48m
    pids_limit: 64
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Servicios
  # ---------------------------------------------------------------------
  account:
    image: ghcr.io/nexus-battle-vi/nexus-battle-account:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      # `combat` se suma para HU-15: consume `/internal/accounts/:subject/battle-profile`
      # al resolver el ingreso a una sala de batalla.
      # `tournament` consulta la elegibilidad y la identidad de equipo (HU-77) en
      # las rutas `@InternalOnly('tournament')` de Account; sin el nombre en esta
      # lista el guard responde 403 aunque la firma HMAC sea valida.
      INTERNAL_SERVICE_ALLOWED_SERVICES: catalog,combat,auction,tournament
      PORT: 3000
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://account:${DB_PASSWORD:-cambiar}@postgres:5432/account
      # `disabled` por defecto: es el estado que describe el BLOCKER de ADR-004.
      # Con el pool ya aprovisionado, activarlo es UNA variable en `.env`, no cinco
      # ediciones de este fichero.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      # `fake` verifica contra cuentas sembradas en memoria; `cognito` invoca
      # AdminInitiateAuth de verdad. Con `NODE_ENV=production`, `fake` IMPIDE
      # ARRANCAR: un binario de produccion no puede dar por buena una
      # contrasena que nadie comprobo.
      #
      # Solo lo lee `account`: es el unico servicio que verifica contrasenas.
      AUTHENTICATION_DRIVER: ${AUTHENTICATION_DRIVER:-fake}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    # El avatar es obligatorio en el registro (HU-01) y se guarda antes que nada:
    # sin un lugar donde escribirlo, ninguna cuenta puede crearse. La imagen ya
    # trae el directorio y apunta ahi; el volumen es lo que hace que los avatares
    # sobrevivan al siguiente `docker compose up`.
    volumes:
      - avatares:/var/lib/nexus/avatars
    depends_on:
      # El esquema tiene que existir ANTES de que el servicio acepte peticiones.
      # Migrar desde el arranque del propio servicio haría que varias réplicas
      # migraran a la vez; un contenedor de un solo uso lo hace una vez y sale.
      account-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  inventory:
    image: ghcr.io/nexus-battle-vi/nexus-battle-player-inventory:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      PORT: 3002
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://inventory:${DB_PASSWORD:-cambiar}@mongo:27017/player-inventory?authSource=player-inventory&replicaSet=rs0
      # `disabled` por defecto: es el estado que describe el BLOCKER de ADR-004.
      # Con el pool ya aprovisionado, activarlo es UNA variable en `.env`, no cinco
      # ediciones de este fichero.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Lectura de Catalog para "Mi Inventario" (HU-27): nombre y demas
      # informacion vigente del producto y busqueda por nombre. Nombre de
      # servicio de compose, red interna, sin TLS: no sale del nodo, no es un
      # secreto. Vacio: el listado del inventario funciona degradado y la
      # busqueda/ficha responden 503.
      CATALOG_BASE_URL: http://catalog:3003
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  catalog:
    image: ghcr.io/nexus-battle-vi/nexus-battle-catalog:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      ACCOUNT_INTERNAL_URL: http://account:3000
      PORT: 3003
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://catalog:${DB_PASSWORD:-cambiar}@mongo:27017/catalog?authSource=catalog&replicaSet=rs0
      # `disabled` por defecto: es el estado que describe el BLOCKER de ADR-004.
      # Con el pool ya aprovisionado, activarlo es UNA variable en `.env`, no cinco
      # ediciones de este fichero.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Vacias en local: sin AWS, el dispatcher del outbox (Catalog#51, HU-38)
      # no tiene a donde publicar. Mismo mecanismo que CATALOG_QUEUE_URL de
      # `notifications` mas abajo -en infra/envs/prod las rellena el mismo
      # output real de infra/modules/catalog_events_queue /
      # catalog_lifecycle_events_queue, y compose/nodes/app.yml activa el
      # productor de verdad-.
      CATALOG_EVENTS_QUEUE_URL: ${CATALOG_EVENTS_QUEUE_URL:-}
      CATALOG_LIFECYCLE_QUEUE_URL: ${CATALOG_LIFECYCLE_QUEUE_URL:-}
      # A proposito NO se define CATALOG_EVENT_DISPATCH_ENABLED aqui: su
      # default en Catalog es `false` (Catalog#51), que es exactamente lo que
      # este compose local sin AWS necesita -con `true` y las URLs vacias,
      # Catalog rechazaria el arranque (fail closed, `ConfigurationError`)-.
      # El nodo real de Terraform (compose/nodes/app.yml) si lo fija a
      # `true`, porque ahi las dos URLs siempre llegan con un valor real
      # cuando los modulos estan aplicados.
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  community:
    image: ghcr.io/nexus-battle-vi/nexus-battle-community:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3004
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://community:${DB_PASSWORD:-cambiar}@postgres:5432/community
      # `disabled` por defecto: es el estado que describe el BLOCKER de ADR-004.
      # Con el pool ya aprovisionado, activarlo es UNA variable en `.env`, no cinco
      # ediciones de este fichero.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Empuja el promedio y el conteo de calificaciones hacia el producto
      # canonico de Catalog tras cada calificacion nueva (HU-40, CA-03), por el
      # contrato interno `POST /internal/v1/catalog/products/{id}/rating`.
      # Nombre de servicio de compose, red interna, sin TLS: no sale del nodo,
      # no es un secreto -mismo patron que `CATALOG_BASE_URL` en `inventory` y
      # que `CATALOG_INTERNAL_URL` en `commerce`-.
      CATALOG_INTERNAL_URL: http://catalog:3003
      # SIN `:?`, a proposito y a diferencia de `commerce`: para Community las
      # tres variables de este contrato son OPCIONALES -su propio codigo trata
      # el secreto vacio como "sin configurar" y sigue funcionando, y calificar
      # NO deja de funcionar si Catalog no recibe el agregado-. Exigirlo aqui
      # haria fallar el arranque de todo el stack por una integracion que el
      # propio servicio esta preparado para no tener. En la practica ya esta
      # definido: `account`, `catalog`, `inventory` y `commerce` lo exigen con
      # `:?` mas arriba en este mismo fichero, asi que Compose ya para el
      # arranque antes de llegar aqui si falta.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
      INTERNAL_SERVICE_NAME: community
      INTERNAL_TIMEOUT_MS: ${INTERNAL_TIMEOUT_MS:-2000}
      # Existencia de producto al comentar (Community#39): contrato publico de
      # Catalog `GET /api/v1/catalog/products/:reference`. Sin ella Community usa
      # el catalogo de demostracion y rechaza los productos reales con 404.
      # Red interna del nodo, no es un secreto -mismo patron que `inventory`-.
      CATALOG_BASE_URL: http://catalog:3003
      # Filtro automatico de contenido (HU-41.7, Management#29): solo genera
      # una senal de revision humana en la cola de moderacion existente -NUNCA
      # oculta, elimina ni sanciona por si solo-. Sin `:?`, a proposito: son
      # vocabulario OPCIONAL, y vacio es una configuracion valida que Community
      # ya sabe interpretar como "sin reglas configuradas, cero detecciones".
      # Infrastructure NO define aqui la politica funcional -ver `.env.example`-.
      COMMENT_MODERATION_FORBIDDEN_TERMS: ${COMMENT_MODERATION_FORBIDDEN_TERMS:-}
      COMMENT_MODERATION_SUSPICIOUS_PATTERNS: ${COMMENT_MODERATION_SUSPICIOUS_PATTERNS:-}
    depends_on:
      community-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  commerce:
    image: ghcr.io/nexus-battle-vi/nexus-battle-commerce:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      COMMERCE_INTEGRATION_MODE: http
      INVENTORY_INTERNAL_URL: http://inventory:3002
      NOTIFICATIONS_INTERNAL_URL: http://notifications:3003
      ACCOUNT_URL: http://account:3000
      PORT: 3005
      CATALOG_INTERNAL_URL: http://catalog:3003
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      INTERNAL_TIMEOUT_MS: ${INTERNAL_TIMEOUT_MS:-2000}
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://commerce:${DB_PASSWORD:-cambiar}@postgres:5432/commerce
      # `disabled` por defecto: es el estado que describe el BLOCKER de ADR-004.
      # Con el pool ya aprovisionado, activarlo es UNA variable en `.env`, no cinco
      # ediciones de este fichero.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Contextos de Sprint 2 (ADR-019): Combat, Missions, Auction y Wallet.
  #
  # Andamiaje: arrancan, verifican identidad y exponen sondas, pero todavia
  # no tienen rutas de negocio. Cada uno con base propia en el nodo de datos.
  # ---------------------------------------------------------------------
  combat:
    image: ghcr.io/nexus-battle-vi/nexus-battle-combat:${COMBAT_IMAGE_TAG:-latest}
    # 256m (antes 160m): con 160m el kernel mato a Combat 19 veces el 2026-10-07 (cgroup
    # OOM, pico medido 165,7 MB, 14 reinicios) sin dejar ningun log de la aplicacion.
    # La memoria oscila (116-128 MiB anon), asi que es techo bajo y no fuga. La imagen
    # de HU-85/EN-036.4 pasa a glibc (bookworm-slim), que usa mas RSS que Alpine.
    mem_limit: 256m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3006
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://combat:${DB_PASSWORD:-cambiar}@mongo:27017/combat?authSource=combat&replicaSet=rs0
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Sin `:?`: sin secreto, las rutas internas del servicio responden 503
      # y el resto sigue funcionando. Lo exigen con `:?` otros servicios de
      # este fichero, asi que en la practica ya esta definido.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
      # HU-15: Combat resuelve displayName/avatar y heroId equipado consultando
      # estos dos servicios internos antes de aceptar un ingreso a sala.
      ACCOUNT_SERVICE_BASE_URL: http://account:3000
      PLAYER_INVENTORY_SERVICE_BASE_URL: http://inventory:3002
      # HU-93: Combat consulta el contrato gameplay de bots y las habilidades
      # epicas en Catalog. Con NODE_ENV=development el servicio asume este mismo
      # valor, pero en produccion es obligatorio: se declara para que cambiar el
      # entorno no impida el arranque.
      CATALOG_SERVICE_BASE_URL: http://catalog:3003
      # HU-22/HU-23: Combat acredita las recompensas y reserva, libera y
      # liquida las apuestas contra Wallet (HMAC, allow-list `combat` de
      # Wallet). Sin esta URL Combat instala clientes "no configurados":
      # toda apuesta responde 503 y las recompensas quedan PENDING_CREDIT, y
      # con `NODE_ENV: development` el guard de arranque no lo advierte.
      WALLET_SERVICE_BASE_URL: http://wallet:3009
      # HU-30: Combat captura la instantanea de drop y transfiere cada
      # derecho contra Player/Inventory (misma URL de arriba) y notifica al
      # ganador y al derrotado contra este servidor interno de Notifications
      # -el mismo que ya atiende a Auction (AUCTION_OUTBID_HTTP_PORT), no uno
      # nuevo-. Sin esta URL el cliente queda "no configurado": la liquidacion
      # sigue transfiriendo la pieza, pero la notificacion de cada jugador
      # queda pendiente hasta que se defina.
      NOTIFICATIONS_SERVICE_BASE_URL: http://notifications:3005
    depends_on:
      combat-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # EN-037.4 (Management #573): mismo worker tecnico que `compose/nodes/app.yml`
  # (ver ese fichero para la justificacion completa), adaptado a la topologia
  # de un solo nodo de esta composicion de referencia (Mongo local, nunca
  # `${DATA_HOST}`). `COMBAT_SOURCE_COMMIT` SI tiene un default local
  # (`local-dev`): en la composicion de referencia no hay un pipeline de
  # publicacion detras, asi que exigirlo con `:?` solo estorbaria el
  # desarrollo local; `compose/nodes/app.yml` (produccion real) SI lo exige.
  combat-trainer:
    image: ghcr.io/nexus-battle-vi/nexus-battle-combat-trainer:${COMBAT_IMAGE_TAG:-latest}
    command:
      [
        'node',
        'dist/infrastructure/training/continuous-training-worker.js',
        '--source-commit',
        '${COMBAT_SOURCE_COMMIT:-local-dev}',
      ]
    mem_limit: 512m
    pids_limit: 128
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://combat:${DB_PASSWORD:-cambiar}@mongo:27017/combat?authSource=combat&replicaSet=rs0
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    depends_on:
      combat-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  combat-evaluator:
    image: ghcr.io/nexus-battle-vi/nexus-battle-combat:${COMBAT_IMAGE_TAG:-latest}
    command:
      [
        'node',
        'dist/infrastructure/evaluation/automatic-evaluation-worker.js',
        '--source-commit',
        '${COMBAT_SOURCE_COMMIT:-local-dev}',
      ]
    mem_limit: 384m
    pids_limit: 128
    # Sin HEALTHCHECK: la imagen runtime de Combat trae uno que pide /api/health/ready por HTTP, y este
    # worker no sirve HTTP. Sin esto Docker lo marca `unhealthy` para siempre (visto el 2026-10-10:
    # 6 fallos seguidos) y enmascara la senal que se usa para vigilar el nodo.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://combat:${DB_PASSWORD:-cambiar}@mongo:27017/combat?authSource=combat&replicaSet=rs0
    depends_on:
      combat-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  missions:
    image: ghcr.io/nexus-battle-vi/nexus-battle-missions:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3007
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://missions:${DB_PASSWORD:-cambiar}@postgres:5432/missions
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Missions firma sus llamadas internas a Combat y a Player/Inventory
      # (HU-70 a HU-73 y HU-09): sin secreto no puede matricular ni cerrar una
      # mision, asi que se exige igual que en Player/Inventory.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      # Integraciones reales. Con NODE_ENV=development el valor por defecto es
      # el doble en memoria, que no reserva al heroe ni simula nada.
      HERO_COMMITMENTS_DRIVER: http
      HERO_ABILITIES_DRIVER: http
      EPIC_GRANTS_DRIVER: http
      EXPERIENCE_REWARDS_DRIVER: http
      PLAYER_INVENTORY_BASE_URL: http://inventory:3002
      COMBAT_SIMULATION_DRIVER: http
      COMBAT_BASE_URL: http://combat:3006
      # HU-10 (Task HU-10.5): liquidacion de recompensas de finalizacion.
      # WALLET_BASE_URL es la unica URL nueva -- Player/Inventory y el secreto
      # interno ya existentes se reutilizan para la XP y el producto.
      MISSION_COMPLETION_REWARDS_DRIVER: http
      WALLET_BASE_URL: http://wallet:3009
      # Apagados por defecto en el servicio. El planificador simula y cierra
      # cada mision al vencer su duracion (HU-72); el barrido acredita la
      # experiencia de cada derrota (HU-09); el reconciliador libera al heroe
      # de una matricula PENDING que Player/Inventory no confirmo; el barrido
      # de HU-10 reintenta las entregas de finalizacion no terminales.
      MISSION_EXECUTION_ENABLED: 'true'
      EXPERIENCE_REWARD_ENABLED: 'true'
      ENROLLMENT_RECONCILER_ENABLED: 'true'
      MISSION_COMPLETION_REWARD_ENABLED: 'true'
    depends_on:
      missions-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  auction:
    image: ghcr.io/nexus-battle-vi/nexus-battle-auction:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3008
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://auction:${DB_PASSWORD:-cambiar}@postgres:5432/auction
      AUTH_MODE: ${AUTH_MODE:-disabled}
      # EN-034 (ADR-024): senales realtime de Subasta. Apagado por defecto; activarlo exige una sola
      # replica de Auction (los tickets viven en memoria) y la migracion 021.
      AUCTION_REALTIME_ENABLED: ${AUCTION_REALTIME_ENABLED:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Con `:?`: Auction se niega a arrancar si hay una *_BASE_URL interna
      # configurada sin secreto, y firma con el todas sus llamadas internas.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      # --- HU-64: dependencias internas de Auction (red interna de compose) ---
      # Sin estas URLs Auction instala adaptadores "no disponibles" y toda
      # compra inmediata responde 503. Base sin `/api`: los clientes de
      # Auction ya incluyen la ruta completa `/api/internal/...`.
      CATALOG_BASE_URL: http://catalog:3003
      ACCOUNT_BASE_URL: http://account:3000
      WALLET_BASE_URL: http://wallet:3009
      INVENTORY_BASE_URL: http://inventory:3002
      ACCOUNT_REQUEST_TIMEOUT_MS: 3000
      WALLET_REQUEST_TIMEOUT_MS: 3000
      INVENTORY_REQUEST_TIMEOUT_MS: 3000
      # Servidor interno de Auction en Notifications (AUCTION_OUTBID_HTTP_PORT):
      # outbid (HU-63) y closed-by-buy-now (HU-64).
      NOTIFICATIONS_BASE_URL: http://notifications:3005
      # Watchlist (HU-68) vive en el servidor distinto de Catalog Notifications.
      NOTIFICATIONS_WATCHLIST_BASE_URL: http://notifications:3004
      NOTIFICATIONS_TIMEOUT_MS: 3000
      AUCTION_EARLY_CLOSURE_RETRY_SCHEDULER_ENABLED: 'true'
      AUCTION_EARLY_CLOSURE_RETRY_POLL_INTERVAL_MS: 30000
      AUCTION_BUY_NOW_PENDING_CLAIM_RETRY_SCHEDULER_ENABLED: 'true'
      AUCTION_BUY_NOW_PENDING_CLAIM_RETRY_POLL_INTERVAL_MS: 30000
      AUCTION_BUY_NOW_PENDING_CLAIM_RETRY_BATCH_SIZE: 50
      AUCTION_SETTLEMENT_SCHEDULER_ENABLED: 'true'
      AUCTION_SETTLEMENT_POLL_INTERVAL_MS: 5000
      AUCTION_SETTLEMENT_BATCH_SIZE: 25
      AUCTION_SETTLEMENT_CONCURRENCY: 4
      AUCTION_SETTLEMENT_LEASE_MS: 300000
      AUCTION_SETTLEMENT_RETRY_DELAY_MS: 30000
      AUCTION_PENDING_CLAIM_EXPIRATION_SCHEDULER_ENABLED: 'true'
      AUCTION_PENDING_CLAIM_EXPIRATION_POLL_INTERVAL_MS: 60000
      AUCTION_PENDING_CLAIM_EXPIRATION_BATCH_SIZE: 100
      AUCTION_SETTLEMENT_QUEUE_URL: ${AUCTION_SETTLEMENT_QUEUE_URL:-}
      AUCTION_SETTLEMENT_EVENT_DISPATCH_ENABLED: 'false'
    depends_on:
      auction-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  wallet:
    image: ghcr.io/nexus-battle-vi/nexus-battle-wallet:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3009
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://wallet:${DB_PASSWORD:-cambiar}@postgres:5432/wallet
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Sin `:?`: sin secreto, las rutas internas del servicio responden 503
      # y el resto sigue funcionando. Lo exigen con `:?` otros servicios de
      # este fichero, asi que en la practica ya esta definido.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
    depends_on:
      wallet-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Contextos de Sprint 3 (ADR-022). Sin `depends_on` desde el proxy, como los
  # de Sprint 2: si una migracion de estos falla, cae su servicio y nada mas.
  tournament:
    image: ghcr.io/nexus-battle-vi/nexus-battle-tournament:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3010
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://tournament:${DB_PASSWORD:-cambiar}@postgres:5432/tournament
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Sin `:?`: sin secreto, las rutas internas responden 503 y el resto
      # sigue funcionando. Hoy no declara consumidores internos (ADR-022).
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
      # HU-77/HU-84/HU-78: elegibilidad de equipos (Account), cobro y compensacion
      # de inscripciones (Wallet) y salas de torneo (Combat). Sin la URL de un
      # servicio, su integracion responde 503: no inventa miembros, cobros ni
      # resultados, pero el flujo correspondiente queda inerte.
      ACCOUNT_BASE_URL: http://account:3000
      WALLET_BASE_URL: http://wallet:3009
      COMBAT_BASE_URL: http://combat:3006
      # HU-86: Tournament pide a Player-Inventory el heroe equipado del campeon y entrega los
      # premios de objeto. Sin esta URL esa integracion queda "no disponible" y responde 503,
      # aunque el contenedor este sano (el 2026-10-10 se desplego sin ella).
      INVENTORY_BASE_URL: http://inventory:3002
    depends_on:
      tournament-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Python con FastAPI (ADR-022, unica excepcion a ADR-002). `APP_ENV` cumple
  # el papel de `NODE_ENV`, y aqui vale `production` a proposito: el servicio
  # se NIEGA a arrancar sin `AUTH_MODE=jwt` y sin PostgreSQL, en vez de
  # degradarse en silencio. 384 MiB porque el motor cargara numpy, scipy y
  # scikit-learn; el andamiaje en reposo mide ~51 MiB.
  chatbot:
    image: ghcr.io/nexus-battle-vi/nexus-battle-chatbot:latest
    mem_limit: 384m
    pids_limit: 128
    environment:
      APP_ENV: production
      PORT: 3011
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://chatbot:${DB_PASSWORD:-cambiar}@postgres:5432/chatbot
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Chatbot no ofrece rutas internas (ADR-022); el secreto solo hace que una
      # futura ruta interna nazca con su contrato en vez de responder 503.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
      CONVERSATION_CIPHER_KEY: ${CONVERSATION_CIPHER_KEY:-}
      # Datos vivos del jugador (HU-48). El chatbot reenvia el testimonio del
      # propio usuario a los /me publicos de estos servicios. Las transacciones
      # salen de Auction. El listado pendiente esta en el servidor de
      # notificaciones de catalogo, puerto 3004.
      INVENTORY_BASE_URL: http://inventory:3002
      MISSIONS_BASE_URL: http://missions:3007
      AUCTION_BASE_URL: http://auction:3008
      NOTIFICATIONS_BASE_URL: http://notifications:3004
    depends_on:
      chatbot-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  notifications:
    image: ghcr.io/nexus-battle-vi/nexus-battle-notifications:latest
    mem_limit: 128m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PURCHASE_HTTP_ENABLED: 'true'
      PURCHASE_HTTP_PORT: 3003
      PURCHASE_INBOX_DRIVER: mongo
      MONGO_URL: mongodb://notifications:${DB_PASSWORD:-cambiar}@mongo:27017/notifications?authSource=notifications&replicaSet=rs0
      MONGO_DB_NAME: notifications
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?Define el secreto interno en .env}
      HEALTH_PORT: 3001
      LOG_LEVEL: info
      # Mailpit permite ver los correos sin enviarlos a nadie.
      EMAIL_DRIVER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: no-reply@nexus-battles.local
      # El adaptador SQS de la cola GENERAL depende de ADR-006 (notificaciones
      # transaccionales), que sigue `Proposed`. Local sin AWS: se mantiene el
      # mecanismo en memoria existente; no hay nada que provisionar aqui.
      QUEUE_DRIVER: memory
      # Para local sin AWS, vacio: el consumidor de catalog.product.created
      # se ejercita en memoria. En el entorno de Terraform esta variable la
      # rellena el output real de infra/modules/catalog_events_queue
      # (ADR-017 Accepted, Infrastructure#93).
      CATALOG_QUEUE_URL: ${CATALOG_QUEUE_URL:-}
      # A proposito NO se define CATALOG_QUEUE_DRIVER aqui: su default en
      # Notifications es `memory` (Notifications#23), que es exactamente lo
      # que este compose local sin AWS necesita -sin el, `sqs` con
      # CATALOG_QUEUE_URL vacia haria que Notifications rechazara el
      # arranque-. El nodo real de Terraform (compose/nodes/app.yml) si lo
      # fija a `sqs`, porque ahi CATALOG_QUEUE_URL siempre llega con un valor
      # real cuando el modulo esta aplicado.
      # --- HU-38: notificaciones de catalogo in-app + banner (Notifications#20) ---
      CATALOG_NOTIFICATIONS_HTTP_ENABLED: 'true'
      CATALOG_NOTIFICATIONS_HTTP_PORT: 3004
      CATALOG_NOTIFICATIONS_REPOSITORY_DRIVER: mongo
      # --- HU-63/HU-64: servidor interno para Auction ---
      # POST /api/internal/v1/notifications/auction/outbid y
      # .../auction/closed-by-buy-now (HMAC, caller `auction`). Requiere
      # CATALOG_NOTIFICATIONS_HTTP_ENABLED=true y un puerto distinto de los
      # demas. No se publica al anfitrion: solo lo alcanza la red interna.
      AUCTION_OUTBID_HTTP_ENABLED: 'true'
      AUCTION_OUTBID_HTTP_PORT: 3005
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Resolucion de propietarios para suspension/reactivacion
      # (Notifications#21, Player-Inventory#23). Nombre de servicio de
      # compose, red interna: no sale del nodo, no es TLS ni un secreto.
      PLAYER_INVENTORY_BASE_URL: http://inventory:3002
      # Para local sin AWS, vacio: el consumidor de ciclo de vida se ejercita
      # en memoria. ADR-018 (Accepted, Management#314) ya provisiona la cola
      # real en infra/modules/catalog_lifecycle_events_queue para el entorno
      # de Terraform, que ya activa el consumo real con
      # CATALOG_LIFECYCLE_QUEUE_DRIVER=sqs (ver compose/nodes/app.yml,
      # Notifications#24). Catalog, ademas, sigue sin dispatcher que publique
      # estos eventos desde su outbox.
      CATALOG_LIFECYCLE_QUEUE_URL: ${CATALOG_LIFECYCLE_QUEUE_URL:-}
      AUCTION_SETTLEMENT_QUEUE_URL: ${AUCTION_SETTLEMENT_QUEUE_URL:-}
      AUCTION_SETTLEMENT_QUEUE_DRIVER: memory
      # A proposito NO se define CATALOG_LIFECYCLE_QUEUE_DRIVER aqui: su
      # default en Notifications es `memory` (Notifications#24), que es
      # exactamente lo que este compose local sin AWS necesita -sin el,
      # `sqs` con CATALOG_LIFECYCLE_QUEUE_URL vacia haria que Notifications
      # rechazara el arranque-. El nodo real de Terraform
      # (compose/nodes/app.yml) si lo fija a `sqs`, porque ahi
      # CATALOG_LIFECYCLE_QUEUE_URL siempre llega con un valor real cuando el
      # modulo esta aplicado.
    depends_on:
      mailpit:
        condition: service_started
      mongo-rs-init:
        condition: service_completed_successfully
      inventory:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Migraciones
  #
  # Un contenedor por servicio, de un solo uso, que lleva el esquema al ultimo
  # estado y sale. El servicio correspondiente espera a que termine BIEN
  # (`service_completed_successfully`), de modo que ninguno acepta peticiones
  # sobre un esquema que no existe.
  #
  # Es un paso explicito y no algo que ocurra al arrancar el servicio: migrar
  # desde el arranque hace que varias replicas migren a la vez, y que una
  # migracion rota deje el servicio en bucle de reinicio en lugar de fallar una
  # sola vez, de forma visible.
  # ---------------------------------------------------------------------
  account-migrate:
    image: ghcr.io/nexus-battle-vi/nexus-battle-account:latest
    # La imagen de servicio, con otro punto de entrada. Usar la MISMA imagen es
    # lo que garantiza que las migraciones que se aplican son exactamente las
    # que lleva el binario que va a arrancar despues.
    command: ['node', 'dist/infrastructure/persistence/migrate.js']
    mem_limit: 128m
    pids_limit: 64
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://account:${DB_PASSWORD:-cambiar}@postgres:5432/account
    depends_on:
      postgres:
        condition: service_healthy
    # Un contenedor de un solo uso NO se reinicia: al terminar bien sale con
    # codigo 0, y reiniciarlo volveria a ejecutar las migraciones en bucle.
    restart: 'no'

