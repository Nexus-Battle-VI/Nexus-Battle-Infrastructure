  # ---------------------------------------------------------------------
  # Persistencia
  #
  # Cada servicio conserva base lógica y credenciales propias aunque el motor
  # sea compartido. Compartir host es una concesión de coste; compartir
  # esquema sería renunciar a la arquitectura.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    mem_limit: 288m
    pids_limit: 256
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar}
      POSTGRES_DB: nexus
      # La usan los scripts de `docker-entrypoint-initdb.d` para crear los
      # usuarios de cada servicio. Sin ella la inicializacion se aborta.
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Bases de Sprint 2 (ADR-019), en fichero aparte para no tocar el
      # `user_data` del nodo `data`. Idempotente: el orden entre ambos da igual.
      - ./init-postgres-sprint-2.sh:/docker-entrypoint-initdb.d/init-sprint-2.sh:ro
      # Bases de Sprint 3 (ADR-022), con el mismo criterio.
      - ./init-postgres-sprint-3.sh:/docker-entrypoint-initdb.d/init-sprint-3.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--keyFile', '/secrets/keyfile', '--bind_ip_all']
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully
    mem_limit: 384m
    pids_limit: 256
    # Definir el usuario raiz es lo que ACTIVA la autenticacion en la imagen
    # oficial. Sin estas variables Mongo arranca abierto y cualquier servicio
    # puede leer la base de otro, aunque cada uno use la suya.
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-cambiar}
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
    volumes:
      - mongo-data:/data/db
      - mongo-secrets:/secrets:ro
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./init-mongo-sprint-2.js:/docker-entrypoint-initdb.d/init-mongo-sprint-2.js:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username root --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''db.adminCommand("ping")''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-key-init:
    image: mongo:8
    restart: 'no'
    volumes:
      - mongo-secrets:/secrets
    entrypoint: ['bash', '-ec', 'if [ ! -s /secrets/keyfile ]; then umask 077; openssl rand -base64 756 > /secrets/keyfile; fi; chown 999:999 /secrets/keyfile; chmod 400 /secrets/keyfile']

  mongo-rs-init:
    image: mongo:8
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
    entrypoint: ['bash', '-ec']
    command:
      - |
        mongosh --quiet --host mongo:27017 --username root --password "$$DB_PASSWORD" --authenticationDatabase admin --eval '
          try { rs.status() } catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]});
          }
          let ready=false;
          for(let i=0;i<60;i++){if(db.hello().isWritablePrimary){ready=true;break;}sleep(1000);}
          if(!ready)throw new Error("Mongo no eligio primario");
        '

  # ---------------------------------------------------------------------
  # Correo de desarrollo
  # ---------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    mem_limit: 64m
    pids_limit: 64
    ports:
      - '8025:8025' # interfaz web para inspeccionar los correos
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  mongo-secrets:
  avatares:
