# Composición del nodo `app` de la topología T2 (ADR-011).
#
# Es la mitad de `compose.example.yml` que corre en el plano de aplicación: el
# proxy, la web, los seis servicios y los contenedores de migración. Las bases
# de datos viven en el nodo `data` y se alcanzan por su IP privada.
#
# La diferencia con la composición de referencia NO es cosmética. Ahí las
# migraciones esperan a `postgres` con `service_healthy`, porque el motor está
# en la misma máquina. Aquí el motor está en otra, así que esa espera no puede
# existir: si el nodo de datos no responde, el contenedor de migración falla,
# el servicio que depende de él no arranca, y eso se ve. Es preferible a una
# espera que no puede cumplirse.
#
# Este fichero lo escribe `user_data` en `/opt/nexus/compose.yml`, junto con un
# `.env` que Terraform genera con `DATA_HOST` y la configuración de identidad.

name: nexus-battles-vi

services:
  # ---------------------------------------------------------------------
  # Entrada
  # ---------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    mem_limit: 64m
    pids_limit: 64
    ports:
      # 8080 es el sitio INTERNO, sin TLS: sondas de salud, comprobaciones por
      # SSM contra 127.0.0.1 y el extremo de un tunel de Session Manager. No
      # debe abrirse en el grupo de seguridad.
      - '8080:8080'
      # 80 y 443 son los que el grupo de seguridad abre cuando
      # `public_ingress_cidrs` deja de estar vacio. Publicarlos aqui no expone
      # nada por si solo: sin regla de entrada, nadie llega. Hasta ahora el
      # grupo abria dos puertos donde no escuchaba nadie.
      - '80:80'
      - '443:443'
    environment:
      # Vacio -> Caddy sirve el sitio publico en `localhost:8443`, que nadie
      # alcanza. Una IP -> certificado de su CA local, con aviso en el
      # navegador. Un dominio con `TLS_CONTACTO` -> certificado real.
      SITIO_PUBLICO: ${SITIO_PUBLICO:-}
      TLS_CONTACTO: ${TLS_CONTACTO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # El certificado y la cuenta de ACME sobreviven al reinicio. Sin esto,
      # cada `docker compose up` volveria a pedir uno, y Let's Encrypt limita
      # cuantos emite por dominio y semana.
      - caddy-datos:/data
    depends_on:
      - web
      - account
      - inventory
      - catalog
      - community
      - commerce
    restart: unless-stopped

  web:
    image: ghcr.io/nexus-battle-vi/nexus-battle-web:latest
    mem_limit: 48m
    pids_limit: 64
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Servicios
  # ---------------------------------------------------------------------
  account:
    image: ghcr.io/nexus-battle-vi/nexus-battle-account:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://account:${DB_PASSWORD}@${DATA_HOST}:5432/account
      AUTH_MODE: ${AUTH_MODE:-disabled}
      # `fake` verifica contra cuentas sembradas en memoria; `cognito` invoca
      # AdminInitiateAuth de verdad. Con `NODE_ENV=production`, `fake` IMPIDE
      # ARRANCAR: un binario de produccion no puede dar por buena una
      # contrasena que nadie comprobo.
      #
      # Solo lo lee `account`: es el unico servicio que verifica contrasenas.
      AUTHENTICATION_DRIVER: ${AUTHENTICATION_DRIVER:-fake}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Con esta variable definida, Account cambia `LoggingNotificationRequester`
      # por `HttpNotificationRequester`. Sin ella la solicitud se registra y se
      # descarta, que es lo que impedia que el codigo de HU-04 saliera nunca del
      # servicio. Nombre de servicio de compose, red interna, sin TLS: no sale
      # del nodo.
      NOTIFICATIONS_INGEST_URL: http://notifications:3002/notifications
      # Contrato interno de evidencia de segundo factor. Vacio NO deja la ruta
      # abierta: el guard interno responde 503 en lugar de dejar pasar, para que
      # un despliegue incompleto no se convierta en un endpoint sin proteger.
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
      INTERNAL_SERVICE_ALLOWED_SERVICES: catalog
    # El avatar es obligatorio en el registro (HU-01), asi que sin un lugar
    # donde escribirlo NINGUNA cuenta puede crearse: el caso de uso guarda el
    # avatar antes que nada y respondia 500. La imagen ya trae el directorio
    # creado y su `AVATAR_STORAGE_PATH` apuntando ahi; el volumen es lo que hace
    # que los avatares SOBREVIVAN al siguiente `docker compose up`, en lugar de
    # vivir en la capa de escritura del contenedor y desaparecer con el.
    #
    # Es un volumen del nodo, no almacenamiento de objetos: si la instancia se
    # reemplaza, se pierden. Igual que las bases de datos hoy. Sacarlos de la
    # maquina exigiria S3, que el alcance actual no autoriza sin un ADR nuevo.
    volumes:
      - avatares:/var/lib/nexus/avatars
    depends_on:
      account-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  inventory:
    image: ghcr.io/nexus-battle-vi/nexus-battle-player-inventory:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3002
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://inventory-runtime:${MONGO_INVENTORY_RUNTIME_PASSWORD}@${DATA_HOST}:27017/player-inventory?authSource=player-inventory&replicaSet=rs0&directConnection=true&retryWrites=true&w=majority
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  catalog:
    image: ghcr.io/nexus-battle-vi/nexus-battle-catalog:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3003
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://catalog-runtime:${MONGO_CATALOG_RUNTIME_PASSWORD}@${DATA_HOST}:27017/catalog?authSource=catalog&replicaSet=rs0&directConnection=true&retryWrites=true&w=majority
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Catalog consulta a Account si el testimonio presentado acredita segundo
      # factor antes de permitir una mutacion administrativa. Nombre de servicio
      # de compose, red interna: no sale del nodo.
      #
      # Sin secreto, las mutaciones administrativas fallan CERRADAS con 503. No
      # quedan abiertas: es justo lo que este contrato viene a impedir.
      ACCOUNT_INTERNAL_URL: http://account:3000
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:-}
      INTERNAL_SERVICE_NAME: catalog
      INTERNAL_TIMEOUT_MS: ${INTERNAL_TIMEOUT_MS:-2000}
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  community:
    image: ghcr.io/nexus-battle-vi/nexus-battle-community:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3004
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://community:${DB_PASSWORD}@${DATA_HOST}:5432/community
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      community-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  commerce:
    image: ghcr.io/nexus-battle-vi/nexus-battle-commerce:latest
    mem_limit: 160m
    pids_limit: 128
    environment:
      NODE_ENV: development
      PORT: 3005
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://commerce:${DB_PASSWORD}@${DATA_HOST}:5432/commerce
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  notifications:
    image: ghcr.io/nexus-battle-vi/nexus-battle-notifications:latest
    mem_limit: 128m
    pids_limit: 128
    environment:
      # `production` NO es cosmetico aqui, es un cierre de seguridad.
      #
      # El servidor de sondas inyecta `POST /dev/enqueue` UNICAMENTE cuando
      # NODE_ENV es `development`, y ese endpoint no valida el cuerpo ni pide
      # credencial: publica en la cola lo que reciba. Con `development` estuvo
      # activo en produccion — comprobado inyectando un mensaje que se entrego.
      # Era inofensivo mientras el correo moria en Mailpit dentro del nodo; con
      # SES pasaria a permitir enviar correo firmado como el dominio verificado
      # a quien alcance la red interna. Por eso se cierra EN EL MISMO cambio que
      # activa SES, nunca despues.
      NODE_ENV: production
      HEALTH_PORT: 3001
      LOG_LEVEL: info
      # Ingesta HTTP del tramo Account -> Notifications (ADR-006).
      #
      # El puerto NO se publica al anfitrion: solo lo alcanza la red interna de
      # compose, que es desde donde llama Account. Sin esto, Account elegia
      # `LoggingNotificationRequester` y el codigo de recuperacion de HU-04
      # moria en su log.
      INGEST_ENABLED: 'true'
      INGEST_PORT: 3002
      EMAIL_DRIVER: ses
      # OBLIGATORIO con `ses`: sin region, `loadConfig` lanza y el worker NO
      # arranca. Es intencionado —un worker mal configurado no debe aparentar
      # salud— pero deja el contenedor caido si se olvida.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Debe coincidir EXACTAMENTE con `ses_from_address` de la politica IAM del
      # nodo: la condicion `ses:FromAddress` compara la direccion literal, y si
      # no coincide IAM deniega. Ademas debe estar verificada en SES, o el envio
      # falla con MailFromDomainNotVerifiedException, que el adaptador clasifica
      # —con razon— como NO reintentable: el correo se pierde sin reintento.
      EMAIL_FROM: no-reply@simuladorupbbga.app
      # El adaptador SQS depende de ADR-006.
      QUEUE_DRIVER: memory
    # Ya no depende de Mailpit: el envio sale por la API de SES. Mailpit se
    # mantiene en el compose a proposito, para que revertir a
    # `EMAIL_DRIVER: smtp` sea un cambio de una linea si SES da problemas.
    #
    # SANDBOX DE SES: mientras la cuenta no tenga acceso de produccion, solo se
    # entrega a direcciones VERIFICADAS. A cualquier otra, SES responde
    # MessageRejected y el correo se descarta sin reintento. Probar HU-04 con
    # una direccion verificada.
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Migraciones
  #
  # Un contenedor por servicio, de un solo uso, que lleva el esquema al ultimo
  # estado y sale. Usan la MISMA imagen que el servicio con otro punto de
  # entrada: es lo que garantiza que las migraciones aplicadas son exactamente
  # las que lleva el binario que arranca despues.
  # ---------------------------------------------------------------------
  account-migrate:
    image: ghcr.io/nexus-battle-vi/nexus-battle-account:latest
    command: ['node', 'dist/infrastructure/persistence/migrate.js']
    mem_limit: 128m
    pids_limit: 64
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://account:${DB_PASSWORD}@${DATA_HOST}:5432/account
    restart: 'no'

  community-migrate:
    image: ghcr.io/nexus-battle-vi/nexus-battle-community:latest
    command: ['node', 'dist/infrastructure/persistence/migrate.js']
    mem_limit: 128m
    pids_limit: 64
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://community:${DB_PASSWORD}@${DATA_HOST}:5432/community
    restart: 'no'

  commerce-migrate:
    image: ghcr.io/nexus-battle-vi/nexus-battle-commerce:latest
    command: ['node', 'dist/infrastructure/persistence/migrate.js']
    mem_limit: 128m
    pids_limit: 64
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgres://commerce:${DB_PASSWORD}@${DATA_HOST}:5432/commerce
    restart: 'no'

  catalog-migrate:
    image: ghcr.io/nexus-battle-vi/nexus-battle-catalog:latest
    command: ['node', 'dist/infrastructure/persistence/migrate.js']
    mem_limit: 128m
    pids_limit: 64
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://catalog-migration:${MONGO_CATALOG_MIGRATION_PASSWORD}@${DATA_HOST}:27017/catalog?authSource=catalog&replicaSet=rs0&directConnection=true&retryWrites=true&w=majority
    restart: 'no'

  inventory-migrate:
    image: ghcr.io/nexus-battle-vi/nexus-battle-player-inventory:latest
    command: ['node', 'dist/infrastructure/persistence/migrate.js']
    mem_limit: 128m
    pids_limit: 64
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PERSISTENCE_DRIVER: mongo
      MONGODB_URI: mongodb://inventory-migration:${MONGO_INVENTORY_MIGRATION_PASSWORD}@${DATA_HOST}:27017/player-inventory?authSource=player-inventory&replicaSet=rs0&directConnection=true&retryWrites=true&w=majority
    restart: 'no'

  # ---------------------------------------------------------------------
  # Correo de desarrollo
  # ---------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    mem_limit: 64m
    pids_limit: 64
    ports:
      - '8025:8025' # interfaz web para inspeccionar los correos
    restart: unless-stopped

# ---------------------------------------------------------------------
# Volumenes
# ---------------------------------------------------------------------
volumes:
  avatares:
  caddy-datos:
