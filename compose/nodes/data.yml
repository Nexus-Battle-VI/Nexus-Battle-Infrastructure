# Composición del nodo `data` de la topología T2 (ADR-011).
#
# PostgreSQL y MongoDB, cada uno con su volumen. Nada más: este nodo no sirve
# tráfico de aplicación.
#
# Los puertos se publican en el nodo, no solo en la red de Docker, porque quien
# los consume está en OTRA máquina. Lo que impide que los alcance cualquiera no
# es el binding sino el grupo de seguridad: `data` solo acepta 5432 y 27017
# desde el grupo `app`, referenciado por identificador y no por CIDR. Está en
# `modules/network/main.tf` y se puede leer ahí.
#
# El replica set de un miembro habilita las transacciones de ADR-015. No aporta
# alta disponibilidad: perder el volumen EBS sigue significando perder los
# datos desde el ultimo backup restaurable.

name: nexus-battles-vi-data

services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 288m
    pids_limit: 256
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nexus
      # La usan los scripts de `docker-entrypoint-initdb.d` para crear los
      # usuarios de cada servicio. Sin ella la inicializacion se aborta.
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${NEXUS_COMPOSE_ASSET_DIR:-.}/init-postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:8
    entrypoint: ['/usr/local/bin/nexus-mongo-entrypoint.sh']
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--oplogSize',
        '128',
        '--keyFile',
        '/data/configdb/nexus/keyfile',
      ]
    mem_limit: 384m
    pids_limit: 256
    ports:
      - '27017:27017'
    # Definir el usuario raiz es lo que ACTIVA la autenticacion en la imagen
    # oficial. Sin estas variables Mongo arranca abierto y cualquier servicio
    # puede leer la base de otro, aunque cada uno use la suya.
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_CATALOG_RUNTIME_PASSWORD: ${MONGO_CATALOG_RUNTIME_PASSWORD}
      MONGO_CATALOG_MIGRATION_PASSWORD: ${MONGO_CATALOG_MIGRATION_PASSWORD}
      MONGO_INVENTORY_RUNTIME_PASSWORD: ${MONGO_INVENTORY_RUNTIME_PASSWORD}
      MONGO_INVENTORY_MIGRATION_PASSWORD: ${MONGO_INVENTORY_MIGRATION_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ${NEXUS_COMPOSE_ASSET_DIR:-.}/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ${NEXUS_COMPOSE_ASSET_DIR:-.}/mongo-entrypoint.sh:/usr/local/bin/nexus-mongo-entrypoint.sh:ro
    secrets:
      - mongo-keyfile
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --host 127.0.0.1 --quiet --username root --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''quit(db.hello().isWritablePrimary === true ? 0 : 1)''',
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  mongo-bootstrap:
    image: mongo:8
    mem_limit: 96m
    pids_limit: 64
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_CATALOG_RUNTIME_PASSWORD: ${MONGO_CATALOG_RUNTIME_PASSWORD}
      MONGO_CATALOG_MIGRATION_PASSWORD: ${MONGO_CATALOG_MIGRATION_PASSWORD}
      MONGO_INVENTORY_RUNTIME_PASSWORD: ${MONGO_INVENTORY_RUNTIME_PASSWORD}
      MONGO_INVENTORY_MIGRATION_PASSWORD: ${MONGO_INVENTORY_MIGRATION_PASSWORD}
      MONGO_REPLICA_SET: rs0
      MONGO_REPLICA_HOST: ${MONGO_REPLICA_HOST:-mongo:27017}
    volumes:
      - ${NEXUS_COMPOSE_ASSET_DIR:-.}/bootstrap-mongo.sh:/opt/nexus/bootstrap-mongo.sh:ro
      - ${NEXUS_COMPOSE_ASSET_DIR:-.}/bootstrap-mongo.js:/opt/nexus/bootstrap-mongo.js:ro
    entrypoint: ['/bin/bash', '/opt/nexus/bootstrap-mongo.sh']
    depends_on:
      mongo:
        condition: service_started
    restart: 'no'

volumes:
  postgres-data:
  mongo-data:

secrets:
  mongo-keyfile:
    file: ${MONGO_KEYFILE_PATH:-./secrets/mongo-keyfile}
