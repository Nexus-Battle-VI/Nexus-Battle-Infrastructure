# Composición del nodo `data` de la topología T2 (ADR-011).
#
# PostgreSQL y MongoDB, cada uno con su volumen. Nada más: este nodo no sirve
# tráfico de aplicación.
#
# Los puertos se publican en el nodo, no solo en la red de Docker, porque quien
# los consume está en OTRA máquina. Lo que impide que los alcance cualquiera no
# es el binding sino el grupo de seguridad: `data` solo acepta 5432 y 27017
# desde el grupo `app`, referenciado por identificador y no por CIDR. Está en
# `modules/network/main.tf` y se puede leer ahí.
#
# Sigue sin haber réplica ni copias de seguridad, y ADR-011 lo dice: perder el
# volumen EBS de este nodo es perder los datos.

name: nexus-battles-vi-data

services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 288m
    pids_limit: 256
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nexus
      # La usan los scripts de `docker-entrypoint-initdb.d` para crear los
      # usuarios de cada servicio. Sin ella la inicializacion se aborta.
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:8
    # 640m, y no 384m: con 384m el nucleo mataba a mongod por falta de memoria
    # unas dos veces al dia (19 reinicios en ~8,5 dias, y cada uno corta a
    # Combat, Player-Inventory, Catalog y Notifications unos segundos).
    #
    # Lo que llenaba el limite era mongod (~220 MiB de memoria anonima en
    # regimen) MAS el `mongosh` del healthcheck, que en cada ejecucion reserva
    # ~157 MiB anonimos (y ~103 MiB de ficheros mapeados) dentro de ESTE MISMO
    # cgroup. Con el healthcheck de abajo el `mongosh` ya no compite, pero el
    # margen se deja: quien abra un `mongosh` a mano con `docker exec` -es lo que
    # se hace para diagnosticar- vuelve a sumar ~260 MiB al proceso servidor.
    #
    # Cabe en el nodo: t4g.small tiene 1841 MiB, Postgres esta limitado a 288m y
    # el sistema, Docker y el agente de SSM usan ~250 MiB. Los limites suman
    # ~1180 MiB y queda mas de un tercio de la RAM para la cache de ficheros.
    #
    # NO se toca la cache de WiredTiger (`--wiredTigerCacheSizeGB`): Mongo la
    # calcula ya con el limite del cgroup y abre con `cache_size=256M`, que es
    # el minimo permitido (0,256 GB). Fijarla no ahorra nada y solo podria
    # subirla.
    mem_limit: 640m
    pids_limit: 256
    ports:
      - '27017:27017'
    # Conjunto de replicas de UN miembro (ADR-015).
    #
    # No da alta disponibilidad -una mayoria de uno sigue siendo el mismo punto
    # unico de fallo de ADR-011-, pero es lo que HABILITA las transacciones
    # multidocumento. Sin el, la escritura de producto, auditoria y outbox no
    # puede ser atomica y HU-33 no cumple sus propias reglas de negocio.
    #
    # `--keyFile` es obligatorio en cuanto hay autenticacion: sin el, mongod se
    # niega a arrancar como miembro de un conjunto. El fichero lo genera el
    # arranque del nodo y NO viaja por git ni por el estado de Terraform.
    #
    # El oplog se fija en 128 MiB por ADR-015. Sin fijarlo, Mongo reserva el 5 %
    # del disco libre, que en este nodo compartido es mucho mas de lo necesario.
    command:
      - --replSet
      - rs0
      - --keyFile
      - /etc/mongo/keyfile
      - --oplogSize
      - '128'
    # Definir el usuario raiz es lo que ACTIVA la autenticacion en la imagen
    # oficial. Sin estas variables Mongo arranca abierto y cualquier servicio
    # puede leer la base de otro, aunque cada uno use la suya.
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      # Solo lectura y con dueno 999 (el usuario `mongodb` de la imagen): mongod
      # RECHAZA un keyfile con permisos mas abiertos que 0600.
      - ./secrets/mongo-keyfile:/etc/mongo/keyfile:ro
    # El healthcheck NO arranca `mongosh`.
    #
    # Antes hacia `mongosh ... db.adminCommand("ping")` cada 10 s. `mongosh` es un
    # Node.js completo: reserva ~157 MiB anonimos por ejecucion, DENTRO del cgroup
    # de mongod, y eso era lo que empujaba al contenedor por encima de su limite
    # (102 de las 121 muertes por falta de memoria fueron un `mongosh`, y 1342 de
    # las 1461 conexiones de una hora fueron suyas, con su cola de registros).
    #
    # Ahora un `perl` de la propia imagen manda un `hello` del protocolo de Mongo
    # (OP_MSG) y comprueba que la respuesta trae `ok: 1`. Cuesta ~1 MiB, no
    # necesita credenciales -Mongo atiende `hello` sin autenticar- y por eso ya
    # no pone la contrasena de root en la linea de comandos de un proceso. Falla
    # si nadie escucha, si la respuesta no es un `ok: 1` y, gracias a `alarm 4`,
    # si mongod acepta la conexion y no responde.
    #
    # Es MENOS que el `ping` autenticado de antes en una cosa: no comprueba que
    # las credenciales de root funcionen. Los servicios ejercitan a diario las
    # suyas, y un fallo de autenticacion les sale a ellos, no aqui.
    #
    # Cada `$` va duplicado (`$$`) porque compose interpola la variable si no.
    healthcheck:
      test:
        - CMD
        - perl
        - -MIO::Socket::INET
        - -e
        - |
          alarm 4;
          $$s = IO::Socket::INET->new("127.0.0.1:27017") or exit 1;
          $$e = "\x10hello\0" . pack("V", 1) . "\x02\$$db\0" . pack("V", 6) . "admin\0";
          $$d = pack("V", length($$e) + 5) . $$e . "\0";
          print $$s pack("V4", 21 + length($$d), 1, 0, 2013), pack("V", 0), "\0", $$d;
          read($$s, $$h, 16) == 16 or exit 1;
          read($$s, $$r, unpack("V", $$h) - 16);
          exit($$r =~ /\x01ok\0\0{6}\xf0\x3f/ ? 0 : 1);
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Inicia el conjunto de replicas UNA vez y sale.
  #
  # Es un servicio y no un paso del arranque del nodo a proposito: asi tambien
  # se ejecuta cuando alguien levanta la composicion a mano, y no solo cuando la
  # instancia nace.
  #
  # ES IDEMPOTENTE. `rs.status()` falla con `NotYetInitialized` la primera vez y
  # devuelve el estado las siguientes; solo se inicia en el primer caso. Volver
  # a llamar a `rs.initiate()` sobre un conjunto ya iniciado devolveria error y
  # dejaria el servicio en fallo sin que nada estuviera mal.
  #
  # El miembro se declara con la IP PRIVADA del nodo, no con `localhost`: la
  # direccion que se guarda en la configuracion del conjunto es la que usaran
  # los clientes desde la otra maquina, y `localhost` los dejaria sin poder
  # resolver el primario.
  mongo-rs-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DATA_HOST: ${DATA_HOST}
    entrypoint:
      - bash
      - -c
      - |
        mongosh --quiet --host mongo:27017           --username root --password "$$DB_PASSWORD" --authenticationDatabase admin           --eval '
            try {
              rs.status()
              print("[nexus] el conjunto de replicas ya estaba iniciado")
            } catch (error) {
              if (error.codeName !== "NotYetInitialized") { throw error }
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: process.env.DATA_HOST + ":27017" }],
              })
              print("[nexus] conjunto de replicas iniciado")
            }
          '

volumes:
  postgres-data:
  mongo-data:
