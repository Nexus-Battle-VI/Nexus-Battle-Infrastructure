name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# El token del workflow solo necesita leer el repositorio. Este repositorio no
# contiene codigo ejecutable ni publica artefactos.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validacion de Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive -diff infra/

      # `-backend=false` y `validate` no necesitan credenciales de AWS: la
      # validacion de CI no toca la cuenta ni puede provisionar nada.
      - name: Inicializar sin backend
        run: terraform -chdir=infra/envs/prod init -backend=false -input=false

      - name: Validar
        run: terraform -chdir=infra/envs/prod validate

  docs:
    name: Validacion de documentacion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar que existen los documentos exigidos
        run: |
          missing=0
          required="
          docs/architecture/SAD.md
          docs/architecture/system-context.md
          docs/architecture/microservices.md
          docs/architecture/sprint-demo-deployment.md
          docs/architecture/target-scale-deployment.md
          docs/architecture/data-ownership.md
          docs/architecture/integration.md
          docs/architecture/security.md
          docs/architecture/observability.md
          docs/architecture/testing.md
          docs/architecture/developer-workflow.md
          docs/architecture/branching-and-release.md
          docs/architecture/cost-constraints.md
          docs/diagrams/system-context.puml
          docs/diagrams/microservices-component.puml
          docs/diagrams/sprint-demo-aws-deployment.puml
          docs/diagrams/target-scale-aws-deployment.puml
          docs/diagrams/sequence-login-2fa.puml
          docs/diagrams/sequence-checkout.puml
          docs/diagrams/sequence-notification.puml
          docs/adr/ADR-001-repository-strategy.md
          docs/adr/ADR-002-backend-stack.md
          docs/adr/ADR-003-frontend-stack.md
          docs/adr/ADR-004-identity-directory.md
          docs/adr/ADR-005-data-strategy.md
          docs/adr/ADR-006-messaging.md
          docs/adr/ADR-007-aws-cost-optimized-platform.md
          docs/adr/ADR-008-iac.md
          docs/adr/ADR-009-observability.md
          docs/adr/ADR-010-reverse-proxy.md
          docs/adr/ADR-011-deployment-topology.md
          docs/adr/ADR-012-orm-odm.md
          infra/README.md
          infra/envs/prod/terraform.tfvars.example
          docs/costs/assumptions.md
          docs/costs/sprint-demo-estimate.md
          docs/contracts/service-catalog.md
          docs/contracts/event-catalog.md
          docs/governance/rulesets/main-protection.template.json
          compose/compose.example.yml
          compose/.env.example
          compose/init-postgres.sql
          compose/init-mongo.js
          "
          for file in $required; do
            if [ ! -f "$file" ]; then
              echo "FALTA: $file"
              missing=$((missing + 1))
            fi
          done
          total=$(echo "$required" | grep -c .)
          if [ "$missing" -gt 0 ]; then
            echo "Faltan ${missing} de ${total} ficheros exigidos por el plan de Foundation."
            exit 1
          fi
          echo "Los ${total} ficheros exigidos estan presentes."

      - name: Verificar que todo ADR declara su estado
        run: |
          missing=0
          for file in docs/adr/ADR-*.md; do
            if ! grep -qE '^\- \*\*Estado:\*\*' "$file"; then
              echo "SIN ESTADO: $file"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Todo ADR debe declarar su estado de forma explicita."
            exit 1
          fi
          echo "Todos los ADR declaran su estado."

      # El placeholder existe para que nadie aplique la plantilla sin sustituir
      # el nombre del check. Aplicarla tal cual bloquearia todas las
      # integraciones de forma permanente.
      - name: Verificar que la plantilla de ruleset conserva su placeholder
        run: |
          if ! grep -q 'REEMPLAZAR-POR-CHECK-REAL-DEL-REPOSITORIO' docs/governance/rulesets/main-protection.template.json; then
            echo "La plantilla de ruleset debe conservar el placeholder del check."
            echo "Un ruleset con un nombre de check inventado bloquea todas las integraciones."
            exit 1
          fi
          echo "La plantilla conserva su placeholder."

      - name: Verificar sintaxis JSON y YAML
        run: |
          for file in $(find docs compose -name '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" || exit 1
            echo "JSON valido: $file"
          done
          for file in $(find compose .github -name '*.yml' -o -name '*.yaml'); do
            node -e "
              const fs = require('fs')
              const text = fs.readFileSync('$file', 'utf8')
              if (text.includes('\t')) {
                console.error('YAML con tabulaciones: $file')
                process.exit(1)
              }
            " || exit 1
            echo "YAML sin tabulaciones: $file"
          done

      - name: Verificar que ADR-008 y ADR-011 acompanan al codigo de infraestructura
        run: |
          # Escribir IaC bajo un ADR que sigue en Proposed produce codigo que
          # nadie ha ratificado. Si existe infra/, sus ADR deben estar Accepted.
          if [ -d infra ]; then
            for adr in docs/adr/ADR-008-iac.md docs/adr/ADR-011-deployment-topology.md; do
              if ! grep -qE '^\- \*\*Estado:\*\* \*\*Accepted\*\*' "$adr"; then
                echo "Existe infra/ pero ${adr} no esta Accepted."
                exit 1
              fi
            done
            echo "Los ADR que respaldan infra/ estan Accepted."
          fi

      - name: Verificar que la infraestructura no abre ingreso publico
        run: |
          # El BLOCKER de ADR-004 impide exponer el sistema a internet. Esta
          # comprobacion existe para que abrirlo requiera un cambio consciente
          # que falla en CI, y no un descuido que nadie ve en la revision.
          if grep -rn '0\.0\.0\.0/0' infra/ --include='*.tfvars.example' ; then
            echo "El ejemplo de variables abre ingreso publico. Ver ADR-004."
            exit 1
          fi
          echo "El ejemplo de variables no abre ingreso publico."

      - name: Verificar ausencia de secretos
        run: |
          # Se excluye .github porque este mismo workflow contiene los patrones
          # de busqueda y coincidiria consigo mismo.
          #
          # Las credenciales de la composicion de referencia no se detectan
          # porque son literalmente la palabra "cambiar": estan declaradas como
          # ejemplo y acompanadas de la instruccion de sustituirlas.
          if grep -rniE 'aws_secret_access_key|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "Se detecto un posible secreto."
            exit 1
          fi
          echo "Sin secretos detectados."

      # La composicion de referencia se valida de verdad, no solo como YAML.
      #
      # `config` resuelve el fichero entero: comprueba que cada `depends_on`
      # apunta a un servicio que existe, que las condiciones son validas y que
      # no hay ciclos. Un fichero sintacticamente correcto puede describir un
      # grafo que no arranca, y eso no se ve leyendolo.
      #
      # No comprueba que las imagenes existan ni que los servicios funcionen:
      # para eso haria falta levantar el stack, que no es trabajo de este job.
      - name: Validar la composicion de referencia
        run: |
          cp compose/compose.example.yml compose/compose.yml
          docker compose -f compose/compose.yml config > /dev/null
          rm compose/compose.yml
          echo "Composicion valida."
