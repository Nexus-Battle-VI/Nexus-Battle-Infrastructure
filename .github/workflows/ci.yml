name: CI

on:
  # Sin filtro de rama destino: se valida TODO pull request, tambien los que
  # apuntan a `develop` o a otra rama de trabajo.
  #
  # Con el filtro anterior, un PR hacia `develop` no ejecutaba NINGUNA
  # comprobacion. Y `develop` esta protegida exigiendo `Calidad y pruebas`:
  # comprobaciones que nunca se reportaban, de modo que el PR no podia
  # satisfacer su propia proteccion y quedaba bloqueado sin explicacion.
  #
  # El `push` si se limita a `main`, que es la unica rama que publica imagen.
  pull_request:
  push:
    branches: [main]

# El token del workflow solo necesita leer el repositorio. Este repositorio no
# contiene codigo ejecutable ni publica artefactos.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validacion de Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive -diff infra/

      # `-backend=false` y `validate` no necesitan credenciales de AWS: la
      # validacion de CI no toca la cuenta ni puede provisionar nada.
      - name: Inicializar sin backend
        run: terraform -chdir=infra/envs/prod init -backend=false -input=false

      - name: Validar
        run: terraform -chdir=infra/envs/prod validate

  docs:
    name: Validacion de documentacion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar que existen los documentos exigidos
        run: |
          missing=0
          required="
          docs/architecture/SAD.md
          docs/architecture/system-context.md
          docs/architecture/microservices.md
          docs/architecture/sprint-demo-deployment.md
          docs/architecture/target-scale-deployment.md
          docs/architecture/data-ownership.md
          docs/architecture/integration.md
          docs/architecture/security.md
          docs/architecture/observability.md
          docs/architecture/testing.md
          docs/architecture/developer-workflow.md
          docs/architecture/branching-and-release.md
          docs/architecture/cost-constraints.md
          docs/diagrams/system-context.puml
          docs/diagrams/microservices-component.puml
          docs/diagrams/sprint-demo-aws-deployment.puml
          docs/diagrams/target-scale-aws-deployment.puml
          docs/diagrams/sequence-login-2fa.puml
          docs/diagrams/sequence-checkout.puml
          docs/diagrams/sequence-notification.puml
          docs/diagrams/catalog-product-contract-compatibility.puml
          docs/diagrams/catalog-atomicity-audit-outbox.puml
          docs/adr/ADR-001-repository-strategy.md
          docs/adr/ADR-002-backend-stack.md
          docs/adr/ADR-003-frontend-stack.md
          docs/adr/ADR-004-identity-directory.md
          docs/adr/ADR-005-data-strategy.md
          docs/adr/ADR-006-messaging.md
          docs/adr/ADR-007-aws-cost-optimized-platform.md
          docs/adr/ADR-008-iac.md
          docs/adr/ADR-009-observability.md
          docs/adr/ADR-010-reverse-proxy.md
          docs/adr/ADR-011-deployment-topology.md
          docs/adr/ADR-012-orm-odm.md
          docs/adr/ADR-013-canonical-product-contract.md
          docs/adr/ADR-015-catalog-atomicity-audit-outbox.md
          infra/README.md
          infra/envs/prod/terraform.tfvars.example
          docs/costs/assumptions.md
          docs/costs/sprint-demo-estimate.md
          docs/contracts/service-catalog.md
          docs/contracts/catalog-product-v1.openapi.yaml
          docs/contracts/event-catalog.md
          docs/governance/rulesets/main-protection.template.json
          compose/compose.example.yml
          compose/.env.example
          compose/nodes/app.yml
          compose/nodes/data.yml
          compose/init-postgres.sh
          compose/init-mongo.js
          "
          for file in $required; do
            if [ ! -f "$file" ]; then
              echo "FALTA: $file"
              missing=$((missing + 1))
            fi
          done
          total=$(echo "$required" | grep -c .)
          if [ "$missing" -gt 0 ]; then
            echo "Faltan ${missing} de ${total} ficheros exigidos por el plan de Foundation."
            exit 1
          fi
          echo "Los ${total} ficheros exigidos estan presentes."

      - name: Verificar que todo ADR declara su estado
        run: |
          missing=0
          for file in docs/adr/ADR-*.md; do
            if ! grep -qE '^\- \*\*Estado:\*\*' "$file"; then
              echo "SIN ESTADO: $file"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Todo ADR debe declarar su estado de forma explicita."
            exit 1
          fi
          echo "Todos los ADR declaran su estado."

      # El placeholder existe para que nadie aplique la plantilla sin sustituir
      # el nombre del check. Aplicarla tal cual bloquearia todas las
      # integraciones de forma permanente.
      - name: Verificar que la plantilla de ruleset conserva su placeholder
        run: |
          if ! grep -q 'REEMPLAZAR-POR-CHECK-REAL-DEL-REPOSITORIO' docs/governance/rulesets/main-protection.template.json; then
            echo "La plantilla de ruleset debe conservar el placeholder del check."
            echo "Un ruleset con un nombre de check inventado bloquea todas las integraciones."
            exit 1
          fi
          echo "La plantilla conserva su placeholder."

      - name: Verificar sintaxis JSON y YAML
        run: |
          for file in $(find docs compose -name '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" || exit 1
            echo "JSON valido: $file"
          done
          for file in $(find docs compose .github -name '*.yml' -o -name '*.yaml'); do
            node -e "
              const fs = require('fs')
              const text = fs.readFileSync('$file', 'utf8')
              if (text.includes('\t')) {
                console.error('YAML con tabulaciones: $file')
                process.exit(1)
              }
            " || exit 1
            echo "YAML sin tabulaciones: $file"
          done

      - name: Validar el contrato OpenAPI de Catalog
        run: npx --yes @redocly/cli@2.49.0 lint docs/contracts/catalog-product-v1.openapi.yaml --format stylish

      - name: Verificar contrato interno de evidencia MFA
        run: python3 scripts/verificar-contrato-mfa-catalog.py

      - name: Verificar PoC de atomicidad MongoDB
        run: python3 scripts/verificar-atomicidad-mongo.py

      - name: Validar el diagrama de compatibilidad de Producto
        run: |
          docker run --rm \
            -v "$PWD/docs/diagrams:/data:ro" \
            ghcr.io/plantuml/plantuml:1.2026.6 \
            -checkonly /data/catalog-product-contract-compatibility.puml

      - name: Validar el diagrama de atomicidad de Producto
        run: |
          docker run --rm \
            -v "$PWD/docs/diagrams:/data:ro" \
            ghcr.io/plantuml/plantuml:1.2026.6 \
            -checkonly /data/catalog-atomicity-audit-outbox.puml

      - name: Verificar que ADR-008 y ADR-011 acompanan al codigo de infraestructura
        run: |
          # Escribir IaC bajo un ADR que sigue en Proposed produce codigo que
          # nadie ha ratificado. Si existe infra/, sus ADR deben estar Accepted.
          if [ -d infra ]; then
            for adr in docs/adr/ADR-008-iac.md docs/adr/ADR-011-deployment-topology.md; do
              if ! grep -qE '^\- \*\*Estado:\*\* \*\*Accepted\*\*' "$adr"; then
                echo "Existe infra/ pero ${adr} no esta Accepted."
                exit 1
              fi
            done
            echo "Los ADR que respaldan infra/ estan Accepted."
          fi

      - name: Verificar que la infraestructura no abre ingreso publico
        run: |
          # Abrir el sistema a internet debe ser un cambio consciente que falla
          # en CI, no un descuido que nadie ve en la revision.
          #
          # SE IGNORAN LAS LINEAS COMENTADAS, y no es una relajacion. La version
          # anterior buscaba la cadena en cualquier posicion y saltaba con un
          # comentario que ADVERTIA contra abrir a 0.0.0.0/0. Una comprobacion
          # que castiga documentar el riesgo ensena a rodearla con eufemismos, y
          # entonces deja de proteger de lo que decia proteger.
          #
          # Una asignacion real -comentada o no- sigue cayendo: lo que se filtra
          # son las lineas que empiezan por `#`, no las que contienen la cadena.
          hallazgos=$(grep -rn '0\.0\.0\.0/0' infra/ --include='*.tfvars.example'             | grep -vE ':[0-9]+:[[:space:]]*#' || true)

          if [ -n "$hallazgos" ]; then
            echo "El ejemplo de variables abre ingreso publico. Ver ADR-004."
            echo "$hallazgos"
            exit 1
          fi
          echo "El ejemplo de variables no abre ingreso publico."

      # AWS solo admite un juego concreto de caracteres en la descripcion de una
      # regla de grupo de seguridad, y el apostrofo NO esta dentro.
      #
      # Esto existe porque costo un apply a medias: la descripcion decia
      # "Let's Encrypt", el plan paso limpio -Terraform no valida ese campo- y
      # el error llego de AWS DESPUES de haber reemplazado ya el nodo. Un fallo
      # a mitad de apply es el peor momento posible, y es justo el que una
      # comprobacion barata en CI evita.
      - name: Verificar las descripciones de las reglas de seguridad
        run: python3 scripts/verificar-descripciones-de-seguridad.py

      - name: Verificar ausencia de secretos
        run: |
          # Se excluye .github porque este mismo workflow contiene los patrones
          # de busqueda y coincidiria consigo mismo.
          #
          # Mencionar el nombre AWS_SECRET_ACCESS_KEY en documentacion NO es un
          # secreto. Para esa variable se exige una asignacion (= o :) seguida
          # de un valor con forma de credencial. Asi una explicacion tecnica no
          # produce falsos positivos, pero una clave escrita realmente en
          # .env/HCL/YAML/JSON sigue haciendo fallar el CI.
          #
          # Las credenciales de la composicion de referencia no se detectan
          # porque son literalmente la palabra "cambiar": estan declaradas como
          # ejemplo y acompanadas de la instruccion de sustituirlas.
          secret_pattern="aws_secret_access_key[\\\"']?[[:space:]]*[:=][[:space:]]*[\\\"']?[A-Za-z0-9/+=]{20,}|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}"

          # Autoprueba del propio detector:
          # 1. Una referencia documental al nombre debe pasar.
          # 2. Una asignacion ficticia con forma de clave debe detectarse.
          if printf '%s\\n' 'AWS_SECRET_ACCESS_KEY' | grep -qiE "$secret_pattern"; then
            echo "El detector confunde el nombre de una variable con un secreto."
            exit 1
          fi

          if ! printf '%s\\n' 'AWS_SECRET_ACCESS_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' | grep -qiE "$secret_pattern"; then
            echo "El detector no reconoce una Secret Access Key asignada."
            exit 1
          fi

          if grep -rniE "$secret_pattern" \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "Se detecto un posible secreto."
            exit 1
          fi

          echo "Sin secretos detectados."

      # La composicion de referencia se valida de verdad, no solo como YAML.
      #
      # `config` resuelve el fichero entero: comprueba que cada `depends_on`
      # apunta a un servicio que existe, que las condiciones son validas y que
      # no hay ciclos. Un fichero sintacticamente correcto puede describir un
      # grafo que no arranca, y eso no se ve leyendolo.
      #
      # No comprueba que las imagenes existan ni que los servicios funcionen:
      # para eso haria falta levantar el stack, que no es trabajo de este job.
      # El Caddyfile es el unico punto por el que pasa TODO el trafico del nodo
      # `app`. Un error de sintaxis ahi no rompe una ruta: deja el proxy sin
      # arrancar y el sistema entero inalcanzable, y no se descubriria hasta
      # despues del despliegue.
      #
      # Se valida con la misma imagen que corre en el nodo. Las variables se dan
      # para que la sustitucion tenga algo que poner; lo que se comprueba es la
      # sintaxis, no los valores.
      - name: Validar el Caddyfile
        run: |
          docker run --rm -v "$PWD/compose:/etc/caddy:ro"             -e SITIO_PUBLICO=ejemplo.test -e TLS_CONTACTO=internal             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "Caddyfile valido con sitio publico definido."

          # Y tambien sin definirlo, que es el estado por defecto: el sistema no
          # expuesto. Si solo se validara la variante configurada, el fichero
          # podria estar roto justo en el camino que se usa a diario.
          docker run --rm -v "$PWD/compose:/etc/caddy:ro"             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "Caddyfile valido con los valores por defecto."

      - name: Validar la composicion de referencia
        run: |
          cp compose/compose.example.yml compose/compose.yml
          docker compose -f compose/compose.yml config > /dev/null
          rm compose/compose.yml
          echo "Composicion de referencia valida."

          # Las composiciones por nodo se validan IGUAL que la de referencia, y
          # es lo unico que impide que se desvien de ella sin que nadie se
          # entere: son las que Terraform escribe en las instancias.
          #
          # Las variables se dan aqui solo para que la sustitucion tenga algo
          # que poner. Lo que se comprueba es la estructura, no los valores.
          for nodo in app data; do
            DATA_HOST=10.0.0.1 DB_PASSWORD=validacion               docker compose -f "compose/nodes/$nodo.yml" config > /dev/null
            echo "Composicion del nodo $nodo valida."
          done
